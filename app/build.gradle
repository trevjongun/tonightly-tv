plugins { id "com.android.application" }

// indirizzo della versione TV del tuo sito: lo scegli quando costruisci l'app (vedi GUIDA)
def tvUrl = (project.findProperty("tvUrl") ?: "https://example.pages.dev/tv.html").toString()
// se hai scritto solo l'indirizzo del sito, aggiungo io /tv.html
if (!(tvUrl ==~ '.*/tv(\\.html)?(\\?.*)?')) tvUrl = tvUrl.replaceAll('/+$', '') + '/tv.html'
// solo indirizzi https semplici: niente virgolette o caratteri strani dentro il codice dell'app
if (!(tvUrl ==~ '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?(\\?[A-Za-z0-9._~=&%-]*)?$')) {
    throw new GradleException("Indirizzo della TV non valido (deve iniziare con https:// e non contenere spazi o virgolette): " + tvUrl)
}
def ks = file("tonightly.jks")

android {
    namespace "app.tonightly.tv"
    compileSdk 34
    defaultConfig {
        applicationId "app.tonightly.tv"
        minSdk 21
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        buildConfigField "String", "TV_URL", "\"" + tvUrl.replace("\"", "") + "\""
        // dove cercare gli aggiornamenti: il repository GitHub che costruisce l'app
        buildConfigField "String", "UPDATE_REPO", "\"" + (System.getenv("GITHUB_REPOSITORY") ?: "").replace("\"", "") + "\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        fixed {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KS_PASS") ?: "tonightly"
                keyAlias "tonightly"
                keyPassword System.getenv("KS_PASS") ?: "tonightly"
            }
        }
    }
    buildTypes {
        release {
            // riduce e offusca il codice dell'APK (i metodi del ponte TonightlyTV restano, vedi proguard-rules.pro)
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig ks.exists() ? signingConfigs.fixed : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // i controlli automatici di stile non devono bloccare la costruzione
    lint { checkReleaseBuilds false; abortOnError false }
}
