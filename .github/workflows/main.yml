name: Costruisci l'app TV

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Indirizzo della versione TV del tuo sito (es. https://tonightly.pages.dev/tv.html)"
        required: true
        default: "https://cinematch-6yr.pages.dev/tv.html"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Firma fissa (facoltativa, dal segreto KEYSTORE_B64)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/tonightly.jks; echo "Uso la firma fissa"; else echo "::warning::Nessun segreto KEYSTORE_B64: firma di prova, cambia a ogni costruzione e gli aggiornamenti dalla TV non si installeranno sopra la versione precedente"; fi
      - name: Costruisco l'APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease -PtvUrl="${{ inputs.url }}" --no-daemon
      - name: Rinomino
        run: cp app/build/outputs/apk/release/app-release.apk tonightly-tv.apk
      - name: Pubblico il file da scaricare sulla TV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-${{ github.run_number }}
          name: Tonightly TV ${{ github.run_number }}
          make_latest: true
          files: tonightly-tv.apk
